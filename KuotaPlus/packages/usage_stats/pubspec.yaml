name: usage_stats
description: "Plugin lokal Kuota+: membaca pemakaian data seluler per aplikasi dari NetworkStatsManager (FR-7)."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.kuotaplus.usage_stats
        pluginClass: UsageStatsPlugin
